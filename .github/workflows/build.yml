name: Build Windows Installer
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Build aplikasi (installer)
        run: npm run build
      - name: Build server (.exe tanpa Node.js)
        run: npm run build:server
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFrog-Setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ChatFrog-Server
          path: |
            server-dist/chatfrog-server.exe
            config.example.json
      - name: Release (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            server-dist/chatfrog-server.exe
            config.example.json
