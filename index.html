<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Chat Frog</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root,[data-theme=light]{--ink:#2b2459;--mute:#6f679c;--glass:rgba(255,255,255,.55);--line:rgba(255,255,255,.95);--field:rgba(255,255,255,.7);--fline:rgba(141,124,247,.35);--card:rgba(255,255,255,.5);--cardon:#fff;--rcv:rgba(255,255,255,.85);--chip:rgba(141,124,247,.14);--err:#d6336c;--sendbg:linear-gradient(135deg,#9d8cff,#7b6af0);--sendfg:#fff;--shadow:rgba(110,90,200,.2);--modal:rgba(255,255,255,.94);
--bg:radial-gradient(circle at 12% 8%,#f3d9ff 0,transparent 42%),radial-gradient(circle at 92% 92%,#c9dcff 0,transparent 45%),linear-gradient(150deg,#e8e3ff,#dcd3fb 55%,#e9d9fb)}
[data-theme=dark]{--ink:#f2efff;--mute:#a9a3d6;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--field:rgba(255,255,255,.08);--fline:rgba(255,255,255,.22);--card:rgba(255,255,255,.06);--cardon:rgba(255,255,255,.17);--rcv:rgba(255,255,255,.12);--chip:rgba(255,255,255,.1);--err:#ffb3cb;--sendbg:#fff;--sendfg:#6c5ce7;--shadow:rgba(0,0,0,.4);--modal:rgba(38,30,78,.94);
--bg:radial-gradient(circle at 12% 8%,#5b3fb5 0,transparent 40%),radial-gradient(circle at 92% 92%,#2f4fa8 0,transparent 45%),linear-gradient(150deg,#16132e,#221a48 55%,#1a1538)}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",system-ui,sans-serif}
html,body{height:100%;color:var(--ink);background:var(--bg);background-attachment:fixed}
.glass{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 36px var(--shadow)}
#top{position:fixed;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:5}
#brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:.2px}
#logo{width:42px;height:42px;padding:6px;border-radius:14px;background:var(--glass);border:1px solid var(--line);box-shadow:0 6px 16px var(--shadow)}
#tools{display:flex;gap:10px}
#tg,#mt{width:44px;height:44px;padding:0;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--ink);box-shadow:0 6px 16px var(--shadow);display:flex;align-items:center;justify-content:center}
#tg svg{width:22px;height:22px} #mt{font-size:19px}
.bd{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#2fb457;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(47,180,87,.4)}
.c.un b{font-weight:800}
#login{height:100%;display:flex;align-items:center;justify-content:center;padding-top:50px}
#login .glass{width:380px;padding:30px;display:flex;flex-direction:column;gap:12px}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:2px} .ctr{text-align:center} .lf{width:88px;height:88px;margin:0 auto 2px;padding:12px;border-radius:28px;background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 26px var(--shadow)}
.links{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-top:-2px}
.links a{color:#7b6af0;font-weight:600;text-decoration:none} [data-theme=dark] .links a{color:#c5baff} .links a:hover{text-decoration:underline}
#logo.live{cursor:pointer} #logo.live:hover{box-shadow:0 0 0 3px rgba(255,120,150,.55),0 6px 16px var(--shadow)}
h1{font-size:22px} .sub{color:var(--mute);font-size:14px;margin-bottom:6px}
input{border:1px solid var(--fline);background:var(--field);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;outline:none}
input::placeholder{color:var(--mute)} input:focus{border-color:#8d7cf7}
button{border:0;border-radius:16px;padding:12px;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#9d8cff,#7b6af0);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(90,70,220,.3)}
button.ghost{background:var(--field);color:var(--ink);box-shadow:none;border:1px solid var(--fline)} .err{color:var(--err);font-size:13px;min-height:16px}
#app{display:none;height:100%;padding:72px 18px 18px;gap:18px}
#side{width:310px;padding:20px;display:flex;flex-direction:column;gap:12px}
#side .hi{color:var(--mute);font-size:14px;margin-bottom:-6px}
#add{display:flex;gap:8px} #add input{flex:1;min-width:0} #add button{padding:0 16px;font-size:18px}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.c{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.c.on{background:var(--cardon);border-color:#8d7cf7}
.av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#ff8fd0,#8d7cf7,#5fb2ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase;flex:none}
#main{flex:1;display:flex;flex-direction:column;padding:20px;min-width:0}
#head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--fline)}
#msgs{flex:1;overflow:auto;padding:16px 4px;display:flex;flex-direction:column;gap:10px}
.m{max-width:68%;padding:11px 15px;border-radius:20px 20px 20px 6px;background:var(--rcv);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;font-size:14px}
.m.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,#a08fff,#7b6af0);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:0 6px 16px rgba(90,70,220,.3)}
.m small{display:block;opacity:.7;font-size:11px;margin-top:4px;text-align:right}
.f{display:flex;gap:8px;align-items:center;margin-top:7px;padding:9px 11px;border-radius:14px;background:var(--chip);border:1px solid var(--fline);color:var(--ink);text-decoration:none;font-size:13px}
.m.me .f{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35);color:#fff}
#bar{display:flex;gap:8px;padding:8px;border-radius:26px;background:var(--field);border:1px solid var(--fline)}
#bar input{flex:1;background:transparent;border:0} #bar button{width:44px;height:44px;padding:0;border-radius:50%}
#bar #sd{background:var(--sendbg);color:var(--sendfg);font-size:16px} #bar .att{background:var(--chip);color:var(--ink);box-shadow:none;font-size:18px} .empty{margin:auto;color:var(--mute)}
.av{overflow:hidden;object-fit:cover}
#meRow{display:flex;align-items:center;gap:12px} #meRow .hi{margin-bottom:2px}
#meAv{position:relative;cursor:pointer;flex:none} #meAv .av{width:54px;height:54px;border-radius:18px;font-size:22px}
#meAv::after{content:"\1F4F7";position:absolute;right:-6px;bottom:-6px;font-size:12px;background:var(--cardon);border:1px solid var(--fline);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.ov{display:none;position:fixed;inset:0;background:rgba(20,15,50,.5);backdrop-filter:blur(6px);z-index:20;align-items:center;justify-content:center}
.ov.on{display:flex}
.pbox{width:340px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;background:var(--modal)}
.pbox .av{width:120px;height:120px;border-radius:34px;font-size:46px}
.pbox button{width:100%} .prow{display:flex;gap:8px;width:100%}
</style></head><body>
<div id="top"><div id="brand"><div id="logo"><svg viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="frogA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8af09a"/><stop offset="1" stop-color="#2fb457"/></linearGradient></defs><circle cx="19" cy="21" r="10" fill="url(#frogA)"/><circle cx="45" cy="21" r="10" fill="url(#frogA)"/><ellipse cx="32" cy="39" rx="25" ry="19" fill="url(#frogA)"/><circle cx="19" cy="21" r="6" fill="#fff"/><circle cx="45" cy="21" r="6" fill="#fff"/><circle cx="20" cy="22" r="3" fill="#1d2230"/><circle cx="44" cy="22" r="3" fill="#1d2230"/><circle cx="13" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><circle cx="51" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><path d="M21 43q11 9 22 0" stroke="#1d5c34" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div><span>Chat Frog</span></div><div id="tools"><button id="mt" title="Bunyi notifikasi"></button><button id="tg" title="Mode gelap / terang"></button></div></div>
<div id="login"><div class="glass">
  <div class="lf"><svg viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="frogB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8af09a"/><stop offset="1" stop-color="#2fb457"/></linearGradient></defs><circle cx="19" cy="21" r="10" fill="url(#frogB)"/><circle cx="45" cy="21" r="10" fill="url(#frogB)"/><ellipse cx="32" cy="39" rx="25" ry="19" fill="url(#frogB)"/><circle cx="19" cy="21" r="6" fill="#fff"/><circle cx="45" cy="21" r="6" fill="#fff"/><circle cx="20" cy="22" r="3" fill="#1d2230"/><circle cx="44" cy="22" r="3" fill="#1d2230"/><circle cx="13" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><circle cx="51" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><path d="M21 43q11 9 22 0" stroke="#1d5c34" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>
  <h1 class="ctr">Chat Frog</h1><div class="sub ctr" id="lsub"></div>
  <input id="srv" placeholder="Alamat server (mis. http://192.168.1.10:3000)">
  <input id="un" placeholder="Username" autocomplete="username">
  <input id="em" placeholder="Email (untuk reset password)" type="email">
  <input id="cd" placeholder="Kode 6 digit dari email" inputmode="numeric">
  <input id="pw" placeholder="Password" type="password">
  <div class="links"><span><span id="swt"></span> <a href="#" id="sw"></a></span><a href="#" id="forgot">Lupa password?</a></div>
  <div class="err" id="err"></div>
  <button id="go"></button>
  <div class="foot">&copy; 2026 Ari Fitriansyah</div>
</div></div>
<div id="app">
  <div id="side" class="glass"><div id="meRow"><div id="meAv" title="Ubah foto profil"></div><div><div class="hi">Halo 👋</div><h1 id="me"></h1></div></div>
    <div id="add"><input id="nu" placeholder="Tambah username..."><button id="nb">+</button></div>
    <div class="err" id="aerr"></div><div class="lbl"><span>Chat</span></div><div id="list"></div></div>
  <div id="main" class="glass"><div id="head"></div><div id="msgs"><div class="empty">Pilih kontak untuk mulai chat</div></div>
    <div id="bar"><button class="att" id="ab">📎</button><input type="file" id="fi" hidden>
    <input id="tx" placeholder="Ketik pesan..."><button id="sd">➤</button></div></div>
</div>
<div id="prof" class="ov"><div class="glass pbox"><h1>Foto Profil</h1><div id="pprev"></div><div class="sub" id="pname"></div>
  <input type="file" id="pf" accept="image/*" hidden>
  <div class="prow"><button id="pchg">Pilih foto</button><button class="ghost" id="prem">Hapus foto</button></div>
  <div class="err" id="perr"></div><button class="ghost" id="pcl">Tutup</button></div></div>
<div id="cf" class="ov"><div class="glass pbox"><h1>Keluar?</h1><div class="sub" id="cft"></div>
  <div class="prow"><button id="cfy">Keluar</button><button class="ghost" id="cfn">Batal</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.theme=t}catch(e){}$('tg').innerHTML=t==='dark'?SUN:MOON}
$('tg').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme((()=>{try{return localStorage.theme}catch(e){}})()||'light');
const S={unread:{},mute:(()=>{try{return localStorage.mute==='1'}catch(e){return false}})(),av:{},url:localStorage.url||'http://localhost:3000',reg:false,tok:null,me:null,cur:null,contacts:[],sock:null};
$('srv').value=S.url;
const MODES={login:{t:'Masuk untuk mulai chat',f:['un','pw'],go:'Masuk',q:'Belum punya akun?',sw:'Buat'},
 reg:{t:'Buat akun baru',f:['un','em','pw'],go:'Buat Akun',q:'Sudah punya akun?',sw:'Masuk'},
 f1:{t:'Kode reset akan dikirim ke email akun',f:['un'],go:'Kirim kode',q:'',sw:'Kembali ke login'},
 f2:{t:'Masukkan kode dari email',f:['cd','pw'],go:'Ganti password',q:'',sw:'Kembali ke login'}};
let mode='login';
function setMode(m,msg){mode=m;const c=MODES[m];$('lsub').textContent=c.t;['un','em','cd','pw'].forEach(i=>$(i).style.display=c.f.includes(i)?'':'none');
  $('pw').placeholder=m==='f2'?'Password baru':'Password';$('go').textContent=c.go;$('swt').textContent=c.q;$('sw').textContent=c.sw;$('forgot').style.display=m==='login'?'':'none';$('err').textContent=msg||''}
setMode('login');
$('sw').onclick=e=>{e.preventDefault();setMode(mode==='login'?'reg':'login')};
$('forgot').onclick=e=>{e.preventDefault();setMode('f1')};
const api=async(p,o={})=>{const r=await fetch(S.url+p,{...o,headers:{Authorization:'Bearer '+S.tok,...(o.body&&!(o.body instanceof FormData)?{'Content-Type':'application/json'}:{})}});const j=await r.json();if(!r.ok){const e=Error(j.error||'Gagal');e.status=r.status;throw e}return j};
const saveSession=()=>{try{localStorage.session=JSON.stringify({url:S.url,token:S.tok})}catch(e){}};
const clearSession=()=>{try{localStorage.removeItem('session')}catch(e){}};
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
$('go').onclick=async()=>{
  S.url=$('srv').value.trim().replace(/\/$/,'');localStorage.url=S.url;
  const b={username:$('un').value,email:$('em').value,code:$('cd').value,password:$('pw').value};
  try{
    if(mode==='f1'){await post('/api/forgot',b);return setMode('f2','Jika akun ada, kode dikirim ke email (berlaku 10 menit). Jika tidak masuk, hubungi admin.')}
    if(mode==='f2'){await post('/api/reset',b);$('pw').value='';$('cd').value='';return setMode('login','Password berhasil diganti. Silakan masuk.')}
    const d=await post(mode==='reg'?'/api/register':'/api/login',b);
    S.tok=d.token;S.me=d.username;S.contacts=d.contacts;await start();saveSession()
  }catch(e){if(mode==='login'||mode==='reg'){S.tok=null}$('err').textContent=e.message}};
async function start(){
  if(!window.io){const L=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
    try{await L('vendor/socket.io.js')}catch(e){try{await L(S.url+'/socket.io/socket.io.js')}catch(e2){throw Error('Gagal memuat modul chat. Instal ulang aplikasi versi terbaru, atau periksa server ('+S.url+').')}}}
  S.sock=io(S.url,{auth:{token:S.tok}});
  S.sock.on('connect',()=>{$('aerr').textContent=''});S.sock.on('profile',p=>{if(p.v)S.av[p.username]=p.v;else delete S.av[p.username];renderMe();renderList();if(S.cur)head()});loadProfiles();loadUnread();S.sock.on('connect_error',e=>{$('aerr').textContent='Koneksi realtime gagal: '+e.message});
  S.sock.on('msg',m=>{const o=m.from===S.me?m.to:m.from;if(!S.contacts.includes(o))loadProfiles();
    S.contacts=[o,...S.contacts.filter(x=>x!==o)];if(o===S.cur)addMsg(m);
    if(m.from!==S.me){ding();if(o===S.cur&&document.hasFocus())markRead(o);else{S.unread[o]=(S.unread[o]||0)+1;if(!document.hasFocus())notify(m)}}
    renderList();updateTotal()});
  $('login').style.display='none';$('app').style.display='flex';setTimeout(refocus,50);try{document.activeElement.blur()}catch(e){}$('logo').classList.add('live');$('logo').title='Klik untuk keluar';$('me').textContent='@'+S.me;renderList()}
function logout(){if(!S.tok)return;$('cft').textContent='Keluar dari akun @'+S.me+'?';$('cf').classList.add('on')}
async function doLogout(){$('cf').classList.remove('on');
  
  try{await api('/api/logout',{method:'POST'})}catch(e){}clearSession();
  try{S.sock&&S.sock.disconnect()}catch(e){}
  S.tok=S.me=S.cur=S.sock=null;S.contacts=[];S.av={};S.unread={};updateTotal();
  $('app').style.display='none';$('login').style.display='flex';$('logo').classList.remove('live');$('logo').title='';
  $('msgs').innerHTML='<div class="empty">Pilih kontak untuk mulai chat</div>';$('head').innerHTML='';$('list').innerHTML='';$('pw').value='';
  setMode('login','Anda sudah keluar.')}
$('logo').onclick=logout;$('cfy').onclick=doLogout;$('cfn').onclick=()=>$('cf').classList.remove('on');$('cf').onclick=e=>{if(e.target===$('cf'))$('cf').classList.remove('on')};
const avatar=(u,x='')=>u==='frogbot'?`<div class="av ${x}">🐸</div>`:S.av[u]?`<img class="av ${x}" alt="" src="${S.url}/api/avatar/${encodeURIComponent(u)}?token=${S.tok}&v=${S.av[u]}">`:`<div class="av ${x}">${u[0]}</div>`;
function renderMe(){$('meAv').innerHTML=avatar(S.me);$('pprev').innerHTML=avatar(S.me)}
function head(){$('head').innerHTML=`${avatar(S.cur)}<b>@${S.cur}</b>`}
async function loadProfiles(){try{S.av=await api('/api/profiles')}catch(e){}renderMe();renderList();if(S.cur)head()}
let AC;
function ding(){if(S.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const t=AC.currentTime;
  [[880,0],[1318,.13]].forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(.28,t+d+.02);g.gain.exponentialRampToValueAtTime(.001,t+d+.4);o.connect(g);g.connect(AC.destination);o.start(t+d);o.stop(t+d+.45)})}catch(e){}}
function setMute(m,t){S.mute=m;try{localStorage.mute=m?'1':'0'}catch(e){}$('mt').textContent=m?'🔕':'🔔';$('mt').title=m?'Bunyi mati (klik untuk menyalakan)':'Bunyi menyala (klik untuk mematikan)';if(t&&!m)ding()}
$('mt').onclick=()=>setMute(!S.mute,true);setMute(S.mute);
function updateTotal(){const n=Object.values(S.unread).reduce((a,b)=>a+b,0);document.title=(n?'('+n+') ':'')+'Chat Frog';
  try{if(window.app){let url=null;if(n){const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.fillStyle='#e5484d';x.beginPath();x.arc(16,16,16,0,7);x.fill();x.fillStyle='#fff';x.font='bold 18px Segoe UI';x.textAlign='center';x.textBaseline='middle';x.fillText(n>9?'9+':String(n),16,17);url=c.toDataURL()}app.setBadge(url,n)}}catch(e){}}
const markRead=o=>{S.unread[o]=0;updateTotal();renderList();api('/api/read',{method:'POST',body:JSON.stringify({with:o})}).catch(()=>{})};
async function loadUnread(){try{S.unread=await api('/api/unread')}catch(e){}renderList();updateTotal()}
function notify(m){try{const n=new Notification('@'+m.from,{body:m.text||(m.file?'📎 '+m.file.name:''),silent:true});n.onclick=()=>{window.app&&app.refocus();open(m.from)};window.app&&app.flash()}catch(e){}}
window.addEventListener('focus',()=>{if(S.cur&&S.unread[S.cur])markRead(S.cur);if(S.cur&&document.activeElement===document.body)$('tx').focus()});
function renderList(){$('list').innerHTML='';S.contacts.forEach(u=>{const d=document.createElement('div');d.className='c'+(u===S.cur?' on':'');
  const n=S.unread[u]||0;if(n)d.classList.add('un');d.innerHTML=`${avatar(u)}<b>@${u}</b>${n?`<span class="bd">${n>99?'99+':n}</span>`:''}`;d.onclick=()=>open(u);$('list').appendChild(d)})}
async function open(u){S.cur=u;if(S.unread[u])markRead(u);renderList();head();$('msgs').innerHTML='';
  (await api('/api/messages/'+u)).forEach(addMsg);$('tx').focus()}
function addMsg(m){const d=document.createElement('div');d.className='m'+(m.from===S.me?' me':'');
  const t=document.createElement('span');t.textContent=m.text;d.appendChild(t);
  if(m.file){const a=document.createElement('a');a.className='f';a.href=`${S.url}/files/${m.file.id}?token=${S.tok}`;
    a.textContent=`📄 ${m.file.name} (${(m.file.size/1024).toFixed(0)} KB)`;d.appendChild(a)}
  const s=document.createElement('small');s.textContent=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.appendChild(s);
  $('msgs').appendChild(d);$('msgs').scrollTop=1e9}
const refocus=()=>{try{window.app&&app.refocus()}catch(e){}setTimeout(()=>{if($('app').style.display!=='none')$('tx').focus()},80)};
const send=file=>{const text=$('tx').value.trim();if(!S.cur||(!text&&!file))return;S.sock.emit('send',{to:S.cur,text,file});$('tx').value=''};
$('bar').addEventListener('mousedown',e=>{if(e.target.tagName!=='BUTTON')setTimeout(()=>$('tx').focus(),0)});
$('sd').onclick=()=>send();$('tx').onkeydown=e=>{if(e.key==='Enter')send()};
$('ab').onclick=()=>{if(S.cur)$('fi').click()};
$('fi').addEventListener('cancel',refocus);
$('fi').onchange=async()=>{refocus();const f=$('fi').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);
  try{send(await api('/api/upload',{method:'POST',body:fd}))}catch(e){$('aerr').textContent=e.message}$('fi').value=''};
$('nb').onclick=async()=>{try{const d=await api('/api/contacts',{method:'POST',body:JSON.stringify({username:$('nu').value})});
  S.contacts=d.contacts;$('nu').value='';$('aerr').textContent='';renderList()}catch(e){$('aerr').textContent=e.message}};

function toAvatar(f){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const n=256,c=document.createElement('canvas');c.width=c.height=n;const s=Math.min(i.width,i.height);
  c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,n,n);c.toBlob(b=>b?ok(b):no(Error('Gagal memproses foto')),'image/jpeg',.88)};i.onerror=()=>no(Error('File bukan gambar yang valid'));i.src=URL.createObjectURL(f)})}
$('meAv').onclick=()=>{$('perr').textContent='';$('pname').textContent='@'+S.me;renderMe();$('prof').classList.add('on')};
$('pcl').onclick=()=>$('prof').classList.remove('on');
$('prof').onclick=e=>{if(e.target===$('prof'))$('prof').classList.remove('on')};
$('pchg').onclick=()=>$('pf').click();
$('pf').addEventListener('cancel',()=>refocus());
$('pf').onchange=async()=>{refocus();const f=$('pf').files[0];$('pf').value='';if(!f)return;$('perr').textContent='Mengunggah...';
  try{const fd=new FormData();fd.append('file',await toAvatar(f),'avatar.jpg');const d=await api('/api/avatar',{method:'POST',body:fd});S.av[S.me]=d.v;renderMe();renderList();if(S.cur)head();$('perr').textContent=''}
  catch(e){$('perr').textContent=e.message}};
$('prem').onclick=async()=>{try{await api('/api/avatar/remove',{method:'POST'});delete S.av[S.me];renderMe();renderList();if(S.cur)head();$('perr').textContent=''}catch(e){$('perr').textContent=e.message}};
// Masuk otomatis: sesi disimpan sampai pengguna menekan Keluar (ikon katak)
(async()=>{
  let s=null;try{s=JSON.parse(localStorage.session||'null')}catch(e){}
  if(!s||!s.token)return;
  $('login').style.visibility='hidden';S.url=s.url;S.tok=s.token;$('srv').value=S.url;
  try{const d=await api('/api/me');S.me=d.username;S.contacts=d.contacts;await start()}
  catch(e){S.tok=null;if(e.status===401){clearSession();setMode('login','Sesi berakhir, silakan masuk lagi.')}
    else setMode('login','Tidak bisa terhubung ke server ('+S.url+'). Periksa koneksi, lalu masuk lagi.')}
  finally{$('login').style.visibility=''}
})();
</script></body></html>
