<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><title>Chat Frog</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root,[data-theme=light]{--ink:#2b2459;--mute:#6f679c;--glass:rgba(255,255,255,.55);--line:rgba(255,255,255,.95);--field:rgba(255,255,255,.7);--fline:rgba(141,124,247,.35);--card:rgba(255,255,255,.5);--cardon:#fff;--rcv:rgba(255,255,255,.85);--chip:rgba(141,124,247,.14);--err:#d6336c;--sendbg:linear-gradient(135deg,#9d8cff,#7b6af0);--sendfg:#fff;--shadow:rgba(110,90,200,.2);
--bg:radial-gradient(circle at 12% 8%,#f3d9ff 0,transparent 42%),radial-gradient(circle at 92% 92%,#c9dcff 0,transparent 45%),linear-gradient(150deg,#e8e3ff,#dcd3fb 55%,#e9d9fb)}
[data-theme=dark]{--ink:#f2efff;--mute:#a9a3d6;--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.18);--field:rgba(255,255,255,.08);--fline:rgba(255,255,255,.22);--card:rgba(255,255,255,.06);--cardon:rgba(255,255,255,.17);--rcv:rgba(255,255,255,.12);--chip:rgba(255,255,255,.1);--err:#ffb3cb;--sendbg:#fff;--sendfg:#6c5ce7;--shadow:rgba(0,0,0,.4);
--bg:radial-gradient(circle at 12% 8%,#5b3fb5 0,transparent 40%),radial-gradient(circle at 92% 92%,#2f4fa8 0,transparent 45%),linear-gradient(150deg,#16132e,#221a48 55%,#1a1538)}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI",system-ui,sans-serif}
html,body{height:100%;color:var(--ink);background:var(--bg);background-attachment:fixed}
.glass{background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 36px var(--shadow)}
#top{position:fixed;top:0;left:0;right:0;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:5}
#brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:.2px}
#logo{width:42px;height:42px;padding:6px;border-radius:14px;background:var(--glass);border:1px solid var(--line);box-shadow:0 6px 16px var(--shadow)}
#tg{width:44px;height:44px;padding:0;border-radius:50%;background:var(--glass);border:1px solid var(--line);color:var(--ink);box-shadow:0 6px 16px var(--shadow);display:flex;align-items:center;justify-content:center}
#tg svg{width:22px;height:22px}
#login{height:100%;display:flex;align-items:center;justify-content:center;padding-top:50px}
#login .glass{width:380px;padding:30px;display:flex;flex-direction:column;gap:12px}
.ctr{text-align:center} .lf{width:88px;height:88px;margin:0 auto 2px;padding:12px;border-radius:28px;background:var(--glass);border:1px solid var(--line);box-shadow:0 10px 26px var(--shadow)}
.links{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-top:-2px}
.links a{color:#7b6af0;font-weight:600;text-decoration:none} [data-theme=dark] .links a{color:#c5baff} .links a:hover{text-decoration:underline}
#logo.live{cursor:pointer} #logo.live:hover{box-shadow:0 0 0 3px rgba(255,120,150,.55),0 6px 16px var(--shadow)}
h1{font-size:22px} .sub{color:var(--mute);font-size:14px;margin-bottom:6px}
input{border:1px solid var(--fline);background:var(--field);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:14px;outline:none}
input::placeholder{color:var(--mute)} input:focus{border-color:#8d7cf7}
button{border:0;border-radius:16px;padding:12px;font-size:14px;cursor:pointer;background:linear-gradient(135deg,#9d8cff,#7b6af0);color:#fff;font-weight:600;box-shadow:0 6px 16px rgba(90,70,220,.3)}
button.ghost{background:var(--field);color:var(--ink);box-shadow:none;border:1px solid var(--fline)} .err{color:var(--err);font-size:13px;min-height:16px}
#app{display:none;height:100%;padding:72px 18px 18px;gap:18px}
#side{width:310px;padding:20px;display:flex;flex-direction:column;gap:12px}
#side .hi{color:var(--mute);font-size:14px;margin-bottom:-6px}
#add{display:flex;gap:8px} #add input{flex:1;min-width:0} #add button{padding:0 16px;font-size:18px}
.lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin-top:4px}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px}
.c{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;background:var(--card);border:1px solid var(--line);cursor:pointer}
.c.on{background:var(--cardon);border-color:#8d7cf7}
.av{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#ff8fd0,#8d7cf7,#5fb2ff);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase;flex:none}
#main{flex:1;display:flex;flex-direction:column;padding:20px;min-width:0}
#head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--fline)}
#msgs{flex:1;overflow:auto;padding:16px 4px;display:flex;flex-direction:column;gap:10px}
.m{max-width:68%;padding:11px 15px;border-radius:20px 20px 20px 6px;background:var(--rcv);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;font-size:14px}
.m.me{align-self:flex-end;border-radius:20px 20px 6px 20px;background:linear-gradient(135deg,#a08fff,#7b6af0);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:0 6px 16px rgba(90,70,220,.3)}
.m small{display:block;opacity:.7;font-size:11px;margin-top:4px;text-align:right}
.f{display:flex;gap:8px;align-items:center;margin-top:7px;padding:9px 11px;border-radius:14px;background:var(--chip);border:1px solid var(--fline);color:var(--ink);text-decoration:none;font-size:13px}
.m.me .f{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.35);color:#fff}
#bar{display:flex;gap:8px;padding:8px;border-radius:26px;background:var(--field);border:1px solid var(--fline)}
#bar input{flex:1;background:transparent;border:0} #bar button{width:44px;height:44px;padding:0;border-radius:50%}
#bar #sd{background:var(--sendbg);color:var(--sendfg);font-size:16px} #bar .att{background:var(--chip);color:var(--ink);box-shadow:none;font-size:18px} .empty{margin:auto;color:var(--mute)}
</style></head><body>
<div id="top"><div id="brand"><div id="logo"><svg viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="frogA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8af09a"/><stop offset="1" stop-color="#2fb457"/></linearGradient></defs><circle cx="19" cy="21" r="10" fill="url(#frogA)"/><circle cx="45" cy="21" r="10" fill="url(#frogA)"/><ellipse cx="32" cy="39" rx="25" ry="19" fill="url(#frogA)"/><circle cx="19" cy="21" r="6" fill="#fff"/><circle cx="45" cy="21" r="6" fill="#fff"/><circle cx="20" cy="22" r="3" fill="#1d2230"/><circle cx="44" cy="22" r="3" fill="#1d2230"/><circle cx="13" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><circle cx="51" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><path d="M21 43q11 9 22 0" stroke="#1d5c34" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div><span>Chat Frog</span></div><button id="tg" title="Mode gelap / terang"></button></div>
<div id="login"><div class="glass">
  <div class="lf"><svg viewBox="0 0 64 64" width="100%" height="100%"><defs><linearGradient id="frogB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8af09a"/><stop offset="1" stop-color="#2fb457"/></linearGradient></defs><circle cx="19" cy="21" r="10" fill="url(#frogB)"/><circle cx="45" cy="21" r="10" fill="url(#frogB)"/><ellipse cx="32" cy="39" rx="25" ry="19" fill="url(#frogB)"/><circle cx="19" cy="21" r="6" fill="#fff"/><circle cx="45" cy="21" r="6" fill="#fff"/><circle cx="20" cy="22" r="3" fill="#1d2230"/><circle cx="44" cy="22" r="3" fill="#1d2230"/><circle cx="13" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><circle cx="51" cy="40" r="3.5" fill="#ff9ec0" opacity=".75"/><path d="M21 43q11 9 22 0" stroke="#1d5c34" stroke-width="3" fill="none" stroke-linecap="round"/></svg></div>
  <h1 class="ctr">Chat Frog</h1><div class="sub ctr" id="lsub"></div>
  <input id="srv" placeholder="Alamat server (mis. http://192.168.1.10:3000)">
  <input id="un" placeholder="Username" autocomplete="username">
  <input id="em" placeholder="Email (untuk reset password)" type="email">
  <input id="cd" placeholder="Kode 6 digit dari email" inputmode="numeric">
  <input id="pw" placeholder="Password" type="password">
  <div class="links"><span><span id="swt"></span> <a href="#" id="sw"></a></span><a href="#" id="forgot">Lupa password?</a></div>
  <div class="err" id="err"></div>
  <button id="go"></button>
</div></div>
<div id="app">
  <div id="side" class="glass"><div class="hi">Halo 👋</div><h1 id="me"></h1>
    <div id="add"><input id="nu" placeholder="Tambah username..."><button id="nb">+</button></div>
    <div class="err" id="aerr"></div><div class="lbl"><span>Chat</span></div><div id="list"></div></div>
  <div id="main" class="glass"><div id="head"></div><div id="msgs"><div class="empty">Pilih kontak untuk mulai chat</div></div>
    <div id="bar"><button class="att" id="ab">📎</button><input type="file" id="fi" hidden>
    <input id="tx" placeholder="Ketik pesan..."><button id="sd">➤</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.theme=t}catch(e){}$('tg').innerHTML=t==='dark'?SUN:MOON}
$('tg').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme((()=>{try{return localStorage.theme}catch(e){}})()||'light');
const S={url:localStorage.url||'http://localhost:3000',reg:false,tok:null,me:null,cur:null,contacts:[],sock:null};
$('srv').value=S.url;
const MODES={login:{t:'Masuk untuk mulai chat',f:['un','pw'],go:'Masuk',q:'Belum punya akun?',sw:'Buat'},
 reg:{t:'Buat akun baru',f:['un','em','pw'],go:'Buat Akun',q:'Sudah punya akun?',sw:'Masuk'},
 f1:{t:'Kode reset akan dikirim ke email akun',f:['un'],go:'Kirim kode',q:'',sw:'Kembali ke login'},
 f2:{t:'Masukkan kode dari email',f:['cd','pw'],go:'Ganti password',q:'',sw:'Kembali ke login'}};
let mode='login';
function setMode(m,msg){mode=m;const c=MODES[m];$('lsub').textContent=c.t;['un','em','cd','pw'].forEach(i=>$(i).style.display=c.f.includes(i)?'':'none');
  $('pw').placeholder=m==='f2'?'Password baru':'Password';$('go').textContent=c.go;$('swt').textContent=c.q;$('sw').textContent=c.sw;$('forgot').style.display=m==='login'?'':'none';$('err').textContent=msg||''}
setMode('login');
$('sw').onclick=e=>{e.preventDefault();setMode(mode==='login'?'reg':'login')};
$('forgot').onclick=e=>{e.preventDefault();setMode('f1')};
const post=(p,b)=>api(p,{method:'POST',body:JSON.stringify(b)});
$('go').onclick=async()=>{
  S.url=$('srv').value.trim().replace(/\/$/,'');localStorage.url=S.url;
  const b={username:$('un').value,email:$('em').value,code:$('cd').value,password:$('pw').value};
  try{
    if(mode==='f1'){await post('/api/forgot',b);return setMode('f2','Jika akun ada, kode dikirim ke email (berlaku 10 menit).')}
    if(mode==='f2'){await post('/api/reset',b);$('pw').value='';$('cd').value='';return setMode('login','Password berhasil diganti. Silakan masuk.')}
    const d=await post(mode==='reg'?'/api/register':'/api/login',b);
    S.tok=d.token;S.me=d.username;S.contacts=d.contacts;start()
  }catch(e){$('err').textContent=e.message}};
async function start(){
  if(!window.io)await new Promise(r=>{const s=document.createElement('script');s.src=S.url+'/socket.io/socket.io.js';s.onload=r;document.head.appendChild(s)});
  S.sock=io(S.url,{auth:{token:S.tok}});
  S.sock.on('msg',m=>{const o=m.from===S.me?m.to:m.from;if(!S.contacts.includes(o)){S.contacts.push(o);renderList()}
    if(o===S.cur)addMsg(m)});
  $('login').style.display='none';$('app').style.display='flex';$('logo').classList.add('live');$('logo').title='Klik untuk keluar';$('me').textContent='@'+S.me;renderList()}
async function logout(){
  if(!S.tok||!confirm('Keluar dari akun @'+S.me+'?'))return;
  try{await api('/api/logout',{method:'POST'})}catch(e){}
  try{S.sock&&S.sock.disconnect()}catch(e){}
  S.tok=S.me=S.cur=S.sock=null;S.contacts=[];
  $('app').style.display='none';$('login').style.display='flex';$('logo').classList.remove('live');$('logo').title='';
  $('msgs').innerHTML='<div class="empty">Pilih kontak untuk mulai chat</div>';$('head').innerHTML='';$('list').innerHTML='';$('pw').value='';
  setMode('login','Anda sudah keluar.')}
$('logo').onclick=logout;
function renderList(){$('list').innerHTML='';S.contacts.forEach(u=>{const d=document.createElement('div');d.className='c'+(u===S.cur?' on':'');
  d.innerHTML=`<div class="av">${u[0]}</div><b>@${u}</b>`;d.onclick=()=>open(u);$('list').appendChild(d)})}
async function open(u){S.cur=u;renderList();$('head').innerHTML=`<div class="av">${u[0]}</div><b>@${u}</b>`;$('msgs').innerHTML='';
  (await api('/api/messages/'+u)).forEach(addMsg)}
function addMsg(m){const d=document.createElement('div');d.className='m'+(m.from===S.me?' me':'');
  const t=document.createElement('span');t.textContent=m.text;d.appendChild(t);
  if(m.file){const a=document.createElement('a');a.className='f';a.href=`${S.url}/files/${m.file.id}?token=${S.tok}`;
    a.textContent=`📄 ${m.file.name} (${(m.file.size/1024).toFixed(0)} KB)`;d.appendChild(a)}
  const s=document.createElement('small');s.textContent=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});d.appendChild(s);
  $('msgs').appendChild(d);$('msgs').scrollTop=1e9}
const send=file=>{const text=$('tx').value.trim();if(!S.cur||(!text&&!file))return;S.sock.emit('send',{to:S.cur,text,file});$('tx').value=''};
$('sd').onclick=()=>send();$('tx').onkeydown=e=>e.key==='Enter'&&send();
$('ab').onclick=()=>S.cur&&$('fi').click();
$('fi').onchange=async()=>{const f=$('fi').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);
  try{send(await api('/api/upload',{method:'POST',body:fd}))}catch(e){alert(e.message)}$('fi').value=''};
$('nb').onclick=async()=>{try{const d=await api('/api/contacts',{method:'POST',body:JSON.stringify({username:$('nu').value})});
  S.contacts=d.contacts;$('nu').value='';$('aerr').textContent='';renderList()}catch(e){$('aerr').textContent=e.message}};
</script></body></html>
